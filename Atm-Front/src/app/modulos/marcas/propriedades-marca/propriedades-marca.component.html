<atm-component class="property-screen">
    <div class="marca-container">
        <atm-tabs [headers]="['Dados da marca']">
            <form [formGroup]="marcaForm" (ngSubmit)="onSubmit()" tab1>
                <atm-fieldset [title]="'Propriedades'">
                    <div class="grid-container">
                        <div class="grid-item codigo">
                            <atm-text-editor id="tx-cod-marca" name="codMarca" formControlName="codMarca">
                                Código:
                            </atm-text-editor>
                        </div>
                        <div class="grid-item nome">
                            <atm-text-editor id="tx-nome-marca" name="nome" [focus]="true" [maxlength]="250" formControlName="nome">
                                Nome:
                            </atm-text-editor>
                            <atm-val-message [control]="marcaForm.get('nome')">
                                Nome é obrigatório e deve ter no máximo 250 caracteres
                            </atm-val-message>
                        </div>
                        <div class="grid-item descricao">
                            <atm-text-editor id="tx-descricao-marca" name="descricao" [maxlength]="250" formControlName="descricao">
                                Descrição:
                            </atm-text-editor>
                            <atm-val-message [control]="marcaForm.get('descricao')">
                                Descrição é obrigatória e deve ter no máximo 250 caracteres
                            </atm-val-message>
                        </div>
                        <div class="grid-item observacao">
                            <atm-text-area id="tx-observacao-marca" [maxlength]="500" [rows]="4"
                                formControlName="observacao">Observação:</atm-text-area>
                        </div>
                    </div>
                </atm-fieldset>

                <atm-val-message [valid]="serverErros == null">
                    {{serverErros}}
                </atm-val-message>

                <div class="form-actions">
                    <div class="form-action">
                        <atm-button label="Cancelar" (onClick)="onResetForm()" [type]="'secondary'"></atm-button>
                    </div>
                    <div class="form-action">
                        <atm-button label="Salvar" [type]="'primary'" [submit]="true"></atm-button>
                    </div>
                </div>
            </form>
        </atm-tabs>
    </div>
</atm-component>
