<style>
    input{
        width: 100%;
        height: 33px;
        margin-top: 5px;
        margin-bottom: 5px;
    }

    .prop-content{
        margin-top: 5px;
        margin-right: auto;
        margin-left: auto;
        width: 350px;
    }

    button{
        width: 100%;
        margin-top: 5px;
    }

    #teste{
        width: 10%;
    }

    #usu-container {
        margin-top: 15px;
        display: grid;
        grid-template-columns: 330px;
        justify-content: space-evenly;

        grid-template-rows: repeat(1, 30px);
    }

    #btn-salvar{
        width: 100%;
        margin-top: 10px;
    }

    atm-text-editor{
        width: 100%;
        
    }

    atm-date-editor{
        width: 100%;        
    }
</style>

<atm-component>
    <div id="usu-container">
        <div id="col1">
            <form id="frm-usuario" [formGroup]="usuariosForm"  (ngSubmit)="onSubmit()">
                <atm-text-editor #nomeCt id="tx-nome" name="nome"  [focus]="true" formControlName="nome" >Nome:</atm-text-editor>
                <atm-val-message [control]="usuariosForm.get('nome')">
                    Nome é obrigatório
                </atm-val-message>
    
                <atm-date-editor name="dataCadastro" id="tx-data-cadastro" formControlName="dataCadastro" >Data de Cadastro: 
                </atm-date-editor>
    
                <atm-text-editor id="tx-telefone" name="telefone" formControlName="telefone">Telefone:</atm-text-editor>
    
                <atm-text-editor id="tx-email" name="email" formControlName="email">E-mail:</atm-text-editor>
                <atm-val-message [control]="usuariosForm.get('email')">
                    E-mail é inválido
                </atm-val-message>
    
                <atm-text-editor id="tx-login" name="login" formControlName="login">Login:</atm-text-editor>
                
                <atm-val-message [control]="usuariosForm.get('login')">
                    Login é obrigatório
                </atm-val-message>
    
                <atm-text-editor id="tx-senha" [type]="'password'" name="senha" formControlName="senha">Senha:</atm-text-editor>
                <atm-val-message [control]="usuariosForm.get('senha')">
                    Senha é obrigatório
                </atm-val-message>
    
                <atm-text-editor id="tx-ck-senha" [type]="'password'" formControlName="confirmaSenha" name="ckSenha">Confirme a senha:</atm-text-editor>
                <atm-val-message [control]="usuariosForm.get('confirmaSenha')">
                    Senha é obrigatório
                </atm-val-message>

                <atm-server-response-error [erros]="erros"></atm-server-response-error>

                <atm-button id="btn-salvar" [submit]="true" [label]="'Salvar'" #btnSalvar></atm-button>
            </form>
        </div>
    </div>
</atm-component>
